# Paste as .github/workflows/build-windows-runtime.yml (NexPlay 6.4.0).
# Builds BCD's Windows runtime (Wine + FEX + DXMT) as BCDCore.framework and publishes it as a
# windows-runtime-* release. Run it by hand (Actions > Build Windows runtime > Run workflow) once, and again only
# to move to a newer BCD. The first run takes hours (Wine, FEX and LLVM are compiled); later runs reuse the cache.
# NexPlay's normal build (build.yml) then puts the newest runtime release into the app.
# BCD: https://github.com/thebcd69/bcd-games. Includes work from BCD by thebcd69.
name: Build Windows runtime

on:
  workflow_dispatch:
    inputs:
      bcd_tag:
        description: "BCD tag to build (empty = tools/windows/runtime.version)"
        type: string
        default: ""

permissions:
  contents: write

jobs:
  runtime:
    runs-on: macos-15
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          path: nexplay

      - name: Choose the BCD version
        run: |
          TAG="${{ github.event.inputs.bcd_tag }}"
          if [ -z "$TAG" ]; then TAG=$(tr -d '[:space:]' < nexplay/tools/windows/runtime.version); fi
          echo "BCD_TAG=$TAG" >> "$GITHUB_ENV"
          echo "Building BCD $TAG"

      - uses: actions/checkout@v4
        with:
          repository: thebcd69/bcd-games
          ref: ${{ env.BCD_TAG }}
          path: bcd
          submodules: recursive
          fetch-depth: 1

      - name: Restore the build cache
        uses: actions/cache/restore@v4
        with:
          key: nexplay-bcd-${{ env.BCD_TAG }}-${{ github.run_id }}
          restore-keys: |
            nexplay-bcd-${{ env.BCD_TAG }}-
            nexplay-bcd-
          path: |
            bcd/toolchains/llvm-ios-build
            bcd/toolchains/llvm-mingw-*
            bcd/toolchains/gnutls-ios
            bcd/toolchains/ffmpeg-ios
            bcd/wine/build-native
            bcd/wine/build-arm64ec
            bcd/FEX/build-ios
            bcd/FEX/build-arm64ec
            bcd/FEX/build-wow64
            bcd/app/Madeira/i386-windows
            bcd/app/Madeira/gl
            bcd/app/Madeira/compat
            bcd/app/Madeira/licenses
            bcd/build/gnutls-ios/obj
            bcd/build/gnutls-ios/src
            bcd/.nexplay-cache

      - name: Install tools
        run: brew install ldid || true

      - name: Build BCD as a library
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash nexplay/tools/windows/build_runtime.sh

      - name: Save the build cache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          key: nexplay-bcd-${{ env.BCD_TAG }}-${{ github.run_id }}
          path: |
            bcd/toolchains/llvm-ios-build
            bcd/toolchains/llvm-mingw-*
            bcd/toolchains/gnutls-ios
            bcd/toolchains/ffmpeg-ios
            bcd/wine/build-native
            bcd/wine/build-arm64ec
            bcd/FEX/build-ios
            bcd/FEX/build-arm64ec
            bcd/FEX/build-wow64
            bcd/app/Madeira/i386-windows
            bcd/app/Madeira/gl
            bcd/app/Madeira/compat
            bcd/app/Madeira/licenses
            bcd/build/gnutls-ios/obj
            bcd/build/gnutls-ios/src
            bcd/.nexplay-cache

      - name: Publish the runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash nexplay/tools/windows/publish_runtime.sh

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-logs
          if-no-files-found: ignore
          path: |
            bcd/archive.log
            bcd/.nexplay-ci-state.json
