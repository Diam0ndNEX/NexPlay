name: NexPlay
options:
  bundleIdPrefix: com.nexplay
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "3.1.0"
    CURRENT_PROJECT_VERSION: "19"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    # The XP/VX/Ace core is off by default. The workflow turns it on with
    # SWIFT_ACTIVE_COMPILATION_CONDITIONS=NEXPLAY_MKXP (see docs/workflow-2.0.0.yml).
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: 0.9.19
targets:
  NexPlay:
    type: application
    platform: iOS
    sources:
      - path: NexPlay
    dependencies:
      - package: ZIPFoundation
    # Desktop Godot games run on Godot's web runtimes; the build downloads the versions in
    # tools/godot/runtimes.txt (only the web template from each official export template, via HTTP ranges)
    # into NexPlay.app/GodotRuntimes. Set NEXPLAY_SKIP_GODOT=1 to build without them.
    postBuildScripts:
      - name: Bundle Godot web runtimes
        basedOnDependencyAnalysis: false
        script: |
          if [ "${NEXPLAY_SKIP_GODOT:-0}" = "1" ]; then echo "Skipping Godot runtimes"; exit 0; fi
          DEST="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/GodotRuntimes"
          /usr/bin/env python3 "${PROJECT_DIR}/tools/fetch_godot_runtimes.py" "$DEST" "${PROJECT_DIR}/build/godot-cache"
    settings:
      base:
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.nexplay.app
        PRODUCT_NAME: NexPlay
        INFOPLIST_FILE: NexPlay/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        # libarchive ships with iOS (7z, RAR, TAR...). NexPlay-Bridging-Header.h declares the functions
        # ArchiveExtractor.swift uses, because the iOS SDK has no libarchive headers.
        SWIFT_OBJC_BRIDGING_HEADER: NexPlay/NexPlay-Bridging-Header.h
        OTHER_LDFLAGS: "$(inherited) -larchive"
