name: NexPlay
# 8.0.0: the Windows engine switch (BCD compiled into NexPlay). Off as committed; CI turns it on when the engine
# release exists (tools/windows/fetch_engine.sh). The bridging header and OTHER_LDFLAGS live there, not here.
include:
  - path: NexPlayWindows.yml
options:
  bundleIdPrefix: com.nexplay
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "8.3.0"
    CURRENT_PROJECT_VERSION: "72"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    # The XP/VX/Ace core is off by default. The workflow turns it on with
    # SWIFT_ACTIVE_COMPILATION_CONDITIONS=NEXPLAY_MKXP (see docs/workflow-6.3.0.yml).
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: 0.9.19
targets:
  NexPlay:
    type: application
    platform: iOS
    sources:
      - path: NexPlay
        # 8.0.0: BCD's code compiles only in builds with the Windows engine (NexPlayWindows.yml adds it).
        excludes:
          - "Windows/BCD"
          - "Windows/BCD/**"
    dependencies:
      - package: ZIPFoundation
      # 6.3.0: built-in JIT. The helper extension runs StikJIT; the app only embeds the framework for it
      # (StikJIT stays out of the app binary). tools/fetch_stikjit.sh puts it in vendor/ in CI.
      - target: NexPlayJITHelper
      - framework: vendor/StikJIT/StikJIT.xcframework
        embed: true
        link: false
    # Desktop Godot games run on Godot's web runtimes; the build downloads the versions in
    # tools/godot/runtimes.txt (only the web template from each official export template, via HTTP ranges)
    # into NexPlay.app/GodotRuntimes. Set NEXPLAY_SKIP_GODOT=1 to build without them.
    postBuildScripts:
      - name: Bundle Godot web runtimes
        basedOnDependencyAnalysis: false
        script: |
          if [ "${NEXPLAY_SKIP_GODOT:-0}" = "1" ]; then echo "Skipping Godot runtimes"; exit 0; fi
          DEST="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/GodotRuntimes"
          /usr/bin/env python3 "${PROJECT_DIR}/tools/fetch_godot_runtimes.py" "$DEST" "${PROJECT_DIR}/build/godot-cache"
      # Ren'Py games run on RenPyWeb (tools/renpy/runtimes.txt: the web runtime and the matching engine from the
      # official SDK). Set NEXPLAY_SKIP_RENPY=1 to build without them.
      - name: Bundle Ren'Py web runtimes
        basedOnDependencyAnalysis: false
        script: |
          if [ "${NEXPLAY_SKIP_RENPY:-0}" = "1" ]; then echo "Skipping Ren'Py runtimes"; exit 0; fi
          DEST="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/RenPyRuntimes"
          /usr/bin/env python3 "${PROJECT_DIR}/tools/fetch_renpy_runtimes.py" "$DEST" "${PROJECT_DIR}/build/renpy-cache"
      # Flash games run on Ruffle (tools/ruffle/version.txt, from npm). Set NEXPLAY_SKIP_RUFFLE=1 to skip it.
      - name: Bundle Ruffle
        basedOnDependencyAnalysis: false
        script: |
          if [ "${NEXPLAY_SKIP_RUFFLE:-0}" = "1" ]; then echo "Skipping Ruffle"; exit 0; fi
          DEST="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/Ruffle"
          /usr/bin/env python3 "${PROJECT_DIR}/tools/fetch_ruffle.py" "$DEST" "${PROJECT_DIR}/build/ruffle-cache"
    settings:
      base:
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.nexplay.app
        PRODUCT_NAME: NexPlay
        INFOPLIST_FILE: NexPlay/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        # The CI build is unsigned; the workflow writes these into the binary with ldid (6.2.0).
        CODE_SIGN_ENTITLEMENTS: NexPlay/NexPlay.entitlements
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        # libarchive ships with iOS (7z, RAR, TAR...). NexPlay-Bridging-Header.h declares the functions
        # ArchiveExtractor.swift uses, because the iOS SDK has no libarchive headers. It also includes JIT/NexJIT.h.
        # 8.0.0: SWIFT_OBJC_BRIDGING_HEADER and OTHER_LDFLAGS (-larchive) are set in NexPlayWindows.yml.

  # 6.3.0: the JIT helper (a classic app extension started by bundle ID, as BCD's MadeiraJITHelper). A process
  # can't debug itself, so StikJIT runs here and attaches to NexPlay. Sources: its folder + the shared messages.
  NexPlayJITHelper:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.4"
    sources:
      - path: NexPlayJITHelper
      - path: NexPlay/JIT/JITRequest.swift
    dependencies:
      - framework: vendor/StikJIT/StikJIT.xcframework
        embed: false
      - sdk: ExtensionFoundation.framework
        weak: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nexplay.app.JITHelper
        PRODUCT_NAME: NexPlayJITHelper
        INFOPLIST_FILE: NexPlayJITHelper/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: NexPlayJITHelper/NexPlayJITHelper.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        # StikJIT.framework sits in NexPlay.app/Frameworks (two levels up from the helper's binary).
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
