name: NexPlay
options:
  bundleIdPrefix: com.nexplay
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.9.0"
    CURRENT_PROJECT_VERSION: "12"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    # The XP/VX/Ace core is off by default. The workflow turns it on with
    # SWIFT_ACTIVE_COMPILATION_CONDITIONS=NEXPLAY_MKXP (see docs/workflow-2.0.0.yml).
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: 0.9.19
targets:
  NexPlay:
    type: application
    platform: iOS
    sources:
      - path: NexPlay
    dependencies:
      - package: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nexplay.app
        PRODUCT_NAME: NexPlay
        INFOPLIST_FILE: NexPlay/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
