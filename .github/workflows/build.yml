name: Build NexPlay

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate app icon
        run: python3 tools/make_icon.py NexPlay/Assets.xcassets/AppIcon.appiconset/icon-1024.png

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild -project NexPlay.xcodeproj -scheme NexPlay \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/NexPlay.app Payload/
          zip -qry NexPlay-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: NexPlay-unsigned
          path: NexPlay-unsigned.ipa

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: NexPlay build ${{ github.run_number }}
          files: NexPlay-unsigned.ipa
